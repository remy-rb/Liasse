services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-liasse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liasse}
      POSTGRES_DB: ${POSTGRES_DB:-liasse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-liasse}:${POSTGRES_PASSWORD:-liasse}@db:5432/${POSTGRES_DB:-liasse}
      SESSION_SECRET: ${SESSION_SECRET:?Run make setup to create .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  frontend:
    build: ./frontend
    ports:
      - "${LIASSE_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
